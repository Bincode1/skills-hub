<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能中心 · Skills Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <div>
        <h1>技能中心</h1>
        <p class="subtitle">团队小工具 &amp; Skills 下载平台</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="badge" id="totalCount">0 个技能</span>
      <button class="btn btn-ghost" id="feedbackBtn">💬 反馈 / 提问题</button>
    </div>
  </header>

  <main class="container">
    <!-- 搜索与筛选 -->
    <section class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索技能名称、描述或标签…" />
      </div>
      <div class="filters" id="categoryFilters">
        <button class="chip active" data-category="all">全部</button>
      </div>
    </section>

    <!-- 技能列表 -->
    <section class="grid" id="skillGrid">
      <!-- cards injected by app.js -->
    </section>

    <p class="empty" id="emptyState" hidden>没有找到匹配的技能。</p>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal" id="detailModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 反馈弹窗 -->
  <div class="modal" id="feedbackModal" hidden>
    <div class="modal-backdrop" data-close-feedback></div>
    <div class="modal-card">
      <button class="modal-close" data-close-feedback>×</button>
      <h2 style="font-size:20px;margin-bottom:6px">💬 反馈 &amp; 提问题</h2>
      <p style="color:var(--text-3);font-size:13px;margin-bottom:20px">
        填写后会跳转到 GitHub Issues 提交，方便我们跟进处理。
      </p>
      <div class="detail-section">
        <div class="detail-label">类型</div>
        <div class="type-select">
          <button class="type-btn active" data-type="bug">🐛 Bug 报告</button>
          <button class="type-btn" data-type="feature">✨ 功能建议</button>
          <button class="type-btn" data-type="other">💭 其他</button>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-label">标题 <span style="color:#ef4444">*</span></div>
        <input type="text" id="fbTitle" class="fb-input" placeholder="一句话描述问题或建议" />
      </div>
      <div class="detail-section">
        <div class="detail-label">详细描述</div>
        <textarea id="fbDesc" class="fb-textarea" rows="5" placeholder="复现步骤、期望结果、实际情况、截图链接等…"></textarea>
      </div>
      <div class="detail-section">
        <div class="detail-label">联系方式（可选）</div>
        <input type="text" id="fbContact" class="fb-input" placeholder="邮箱 / 飞书 / 微信，方便我们联系你" />
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost" data-close-feedback>取消</button>
        <button class="btn btn-primary" id="fbSubmit">提交到 GitHub Issues</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <footer class="footer">
    <p>© 2026 技能中心 · 托管于 GitHub Pages ·
      <a href="https://github.com/Bincode1/skills-hub/issues" target="_blank" style="color:var(--primary);text-decoration:none">问题反馈</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
